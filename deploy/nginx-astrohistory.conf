# AstroHistory v6 — bloco de servidor nginx (atrás da Cloudflare). NÃO aplicado automaticamente.
# - Proxy para o uvicorn em 127.0.0.1:8000
# - IP real da Cloudflare para o middleware de segurança da aplicação
# - Bloqueio de /api/*, /docs, /redoc, /openapi.json para tráfego externo (defesa em profundidade)
# - Logs SEM query string em /natal/* (dados de nascimento)
# - Rate limit nas rotas de cálculo pesado

log_format astro_noargs '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent"';
limit_req_zone $binary_remote_addr zone=astro_compute:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=astro_places:10m rate=60r/m;

# IPs da Cloudflare (atualize periodicamente: https://www.cloudflare.com/ips/)
set_real_ip_from 173.245.48.0/20;  set_real_ip_from 103.21.244.0/22;  set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;    set_real_ip_from 141.101.64.0/18;  set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;  set_real_ip_from 188.114.96.0/20;  set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;  set_real_ip_from 162.158.0.0/15;   set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;    set_real_ip_from 172.64.0.0/13;    set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/html text/css application/json application/javascript text/calendar text/csv;
    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ ^/(api/|docs|redoc|openapi\.json) {
        return 404;
    }

    location /natal/places {
        limit_req zone=astro_places burst=20 nodelay;
        access_log /var/log/nginx/astro_access.log astro_noargs;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    location ~ ^/(natal|simulator) {
        limit_req zone=astro_compute burst=10 nodelay;
        access_log /var/log/nginx/astro_access.log astro_noargs;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        expires 7d;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }
}
