services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - ASTRO_ENV=production
      - ASTRO_DB_PATH=/data/history_astrology.db
    volumes:
      - ./db:/data
      - ./data/ephemeris:/app/data/ephemeris
    expose:
      - "8000"

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
