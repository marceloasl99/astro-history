# Glossário bilíngue do AstroHistory (v6). Cada termo: chave, rótulos e definições PT/EN, categoria.
terms:
  - { key: aspecto, pt: "Aspecto", en: "Aspect", cat: astro, def_pt: "Ângulo significativo entre dois pontos do zodíaco: conjunção (0°), sextil (60°), quadratura (90°), trígono (120°) e oposição (180°).", def_en: "A meaningful angle between two zodiac points: conjunction (0°), sextile (60°), square (90°), trine (120°) and opposition (180°)." }
  - { key: orbe, pt: "Orbe", en: "Orb", cat: astro, def_pt: "Tolerância angular máxima (em graus) para considerar um aspecto ativo. A pesquisa usa 3° fixos; o módulo pessoal usa orbes por planeta (1° a 4°).", def_en: "Maximum angular tolerance (degrees) for an aspect to count as active. The research uses a fixed 3°; the personal module uses per-planet orbs (1° to 4°)." }
  - { key: conjuncao, pt: "Conjunção", en: "Conjunction", cat: astro, def_pt: "Dois corpos na mesma longitude eclíptica (0°). Fusão e foco do tema.", def_en: "Two bodies at the same ecliptic longitude (0°). Fusion and focus of the theme." }
  - { key: quadratura, pt: "Quadratura", en: "Square", cat: astro, def_pt: "Aspecto de 90°, tradicionalmente tenso: atrito que pede ação e ajuste.", def_en: "A 90° aspect, traditionally tense: friction that calls for action and adjustment." }
  - { key: oposicao, pt: "Oposição", en: "Opposition", cat: astro, def_pt: "Aspecto de 180°: polaridade, confronto e busca de equilíbrio.", def_en: "A 180° aspect: polarity, confrontation and the search for balance." }
  - { key: trigono, pt: "Trígono", en: "Trine", cat: astro, def_pt: "Aspecto de 120°, tradicionalmente harmônico: fluidez e facilidade.", def_en: "A 120° aspect, traditionally harmonious: flow and ease." }
  - { key: sextil, pt: "Sextil", en: "Sextile", cat: astro, def_pt: "Aspecto de 60°: oportunidade e cooperação.", def_en: "A 60° aspect: opportunity and cooperation." }
  - { key: transito, pt: "Trânsito", en: "Transit", cat: astro, def_pt: "Posição de um planeta em movimento (hoje, no passado ou no futuro) em relação a um mapa fixo — natal ou nacional.", def_en: "The position of a moving planet (today, past or future) relative to a fixed chart — natal or national." }
  - { key: aplicativo, pt: "Aplicativo", en: "Applying", cat: astro, def_pt: "Aspecto que ainda se aproxima do ângulo exato.", def_en: "An aspect still approaching the exact angle." }
  - { key: separativo, pt: "Separativo", en: "Separating", cat: astro, def_pt: "Aspecto que já passou do ângulo exato e se afasta.", def_en: "An aspect past the exact angle and moving away." }
  - { key: retrogrado, pt: "Retrógrado (℞)", en: "Retrograde (℞)", cat: astro, def_pt: "Movimento aparente para trás no zodíaco, visto da Terra. Em trânsitos, produz passagens múltiplas (1, 3 ou 5) sobre o mesmo ponto.", def_en: "Apparent backward motion through the zodiac as seen from Earth. In transits it produces multiple passes (1, 3 or 5) over the same point." }
  - { key: casas, pt: "Casas astrológicas", en: "Astrological houses", cat: astro, def_pt: "Divisão do céu em 12 setores a partir do horizonte local; exigem hora e local de nascimento. Sistemas: Placidus (padrão), Koch, Signos Inteiros, Igual, Porphyry.", def_en: "Division of the sky into 12 sectors from the local horizon; requires birth time and place. Systems: Placidus (default), Koch, Whole Sign, Equal, Porphyry." }
  - { key: ascendente, pt: "Ascendente (ASC)", en: "Ascendant (ASC)", cat: astro, def_pt: "Grau do zodíaco que nasce no horizonte leste no momento do nascimento; cúspide da casa 1.", def_en: "Zodiac degree rising on the eastern horizon at birth; cusp of the 1st house." }
  - { key: meio_do_ceu, pt: "Meio do Céu (MC)", en: "Midheaven (MC)", cat: astro, def_pt: "Ponto mais alto da eclíptica no momento do nascimento; cúspide da casa 10 nos sistemas de quadrantes.", def_en: "Highest point of the ecliptic at birth; cusp of the 10th house in quadrant systems." }
  - { key: zodiaco_tropical, pt: "Zodíaco tropical", en: "Tropical zodiac", cat: astro, def_pt: "Zodíaco ancorado nos equinócios e solstícios (0° Áries = equinócio de março). É o usado na astrologia moderna ocidental e em todo o site.", def_en: "Zodiac anchored to equinoxes and solstices (0° Aries = March equinox). Used in modern Western astrology and throughout this site." }
  - { key: progressao_secundaria, pt: "Progressão secundária", en: "Secondary progression", cat: astro, def_pt: "Técnica simbólica: cada dia após o nascimento equivale a um ano de vida (1 dia = 1 ano trópico). A Lua progredida muda de signo a cada ~2,5 anos.", def_en: "Symbolic technique: each day after birth equals one year of life (1 day = 1 tropical year). The progressed Moon changes sign every ~2.5 years." }
  - { key: lua_progredida, pt: "Lua progredida", en: "Progressed Moon", cat: astro, def_pt: "A Lua da carta progredida; percorre o zodíaco em ~27 anos e marca o clima emocional de cada fase da vida.", def_en: "The Moon of the progressed chart; circles the zodiac in ~27 years and marks the emotional climate of each life phase." }
  - { key: retorno, pt: "Retorno planetário", en: "Planetary return", cat: astro, def_pt: "Momento em que um planeta volta à posição natal: Retorno de Saturno (~29,5 anos), de Júpiter (~12), de Quíron (~50), nodal (~18,6).", def_en: "The moment a planet returns to its natal position: Saturn Return (~29.5 years), Jupiter (~12), Chiron (~50), nodal (~18.6)." }
  - { key: nodo_lunar, pt: "Nodo Norte", en: "North Node", cat: astro, def_pt: "Ponto em que a órbita da Lua cruza a eclíptica rumo ao norte. 'Verdadeiro' oscila; 'médio' é suavizado (usado para trânsitos).", def_en: "Point where the Moon's orbit crosses the ecliptic northward. 'True' oscillates; 'mean' is smoothed (used for transits)." }
  - { key: quiron, pt: "Quíron", en: "Chiron", cat: astro, def_pt: "Centauro descoberto em 1977, incorporado pela astrologia moderna como arquétipo da ferida e da cura. Efemérides válidas de 675 a 4650 d.C.", def_en: "Centaur discovered in 1977, adopted by modern astrology as the archetype of wound and healing. Ephemeris valid 675–4650 CE." }
  - { key: lilith, pt: "Lilith (Lua Negra)", en: "Lilith (Black Moon)", cat: astro, def_pt: "Apogeu médio da órbita lunar; ponto simbólico de autonomia e sombra.", def_en: "Mean apogee of the lunar orbit; a symbolic point of autonomy and shadow." }
  - { key: estrelas_fixas, pt: "Estrelas fixas", en: "Fixed stars", cat: astro, def_pt: "Estrelas brilhantes projetadas na eclíptica; o site considera 30 estrelas em conjunção estrita (orbe 0,3°).", def_en: "Bright stars projected onto the ecliptic; the site considers 30 stars in strict conjunction (0.3° orb)." }
  - { key: hora_media_local, pt: "Hora média local (LMT)", en: "Local mean time (LMT)", cat: tempo, def_pt: "Hora solar média da longitude do lugar (longitude/15), usada antes da adoção da hora legal em cada zona.", def_en: "Mean solar time of the place's longitude (longitude/15), used before each zone adopted standard time." }
  - { key: calendario_juliano, pt: "Calendário juliano / gregoriano", en: "Julian / Gregorian calendar", cat: tempo, def_pt: "Datas anteriores à adoção gregoriana (1582 em Roma; 1752 na Grã-Bretanha; 1918 na Rússia) são convertidas segundo o país.", def_en: "Dates before Gregorian adoption (1582 in Rome; 1752 in Britain; 1918 in Russia) are converted according to the country." }
  - { key: delta_t, pt: "ΔT", en: "ΔT", cat: tempo, def_pt: "Diferença entre o tempo terrestre e o tempo universal; incerta para a Antiguidade (minutos a horas), afeta Lua e casas.", def_en: "Difference between terrestrial and universal time; uncertain in antiquity (minutes to hours), affecting the Moon and houses." }
  - { key: swiss_ephemeris, pt: "Swiss Ephemeris", en: "Swiss Ephemeris", cat: tempo, def_pt: "Biblioteca da Astrodienst baseada no JPL DE431, com precisão de frações de segundo de arco; o site usa os arquivos completos (sepl/semo).", def_en: "Astrodienst library based on JPL DE431, accurate to fractions of an arcsecond; the site uses the full files (sepl/semo)." }
  - { key: indice_tensao, pt: "Índice de tensão (0–1000)", en: "Tension index (0–1000)", cat: metodo, def_pt: "Soma ponderada dos aspectos tensos entre os 9 corpos principais, convertida em percentil empírico contra todos os dias de 1800 a 2100.", def_en: "Weighted sum of tense aspects among the 9 main bodies, converted to an empirical percentile against all days 1800–2100." }
  - { key: barbault, pt: "Índice Cíclico de Barbault", en: "Barbault Cyclic Index", cat: metodo, def_pt: "Soma das distâncias angulares entre os planetas lentos (Júpiter a Plutão); mínimos coincidiriam, segundo Barbault, com crises coletivas.", def_en: "Sum of angular distances between the slow planets (Jupiter to Pluto); minima would, per Barbault, coincide with collective crises." }
  - { key: oshop, pt: "Soma de cossenos (Oshop)", en: "Sum of cosines (Oshop)", cat: metodo, def_pt: "Métrica de concentração planetária proposta por Renay Oshop, testada aqui com permutações de Monte Carlo.", def_en: "Planetary clustering metric proposed by Renay Oshop, tested here with Monte Carlo permutations." }
  - { key: modelo_nulo, pt: "Modelo nulo", en: "Null model", cat: stats, def_pt: "Distribuição de referência gerada embaralhando datas (deslocamento circular) para saber o que seria esperado ao acaso.", def_en: "Reference distribution generated by shuffling dates (circular shift) to learn what chance alone would produce." }
  - { key: permutacao, pt: "Permutação circular", en: "Circular-shift permutation", cat: stats, def_pt: "Teste que desloca a série de eventos no tempo preservando sua autocorrelação; 10.000 repetições.", def_en: "Test that shifts the event series in time while preserving its autocorrelation; 10,000 repetitions." }
  - { key: fdr, pt: "FDR (Benjamini-Hochberg)", en: "FDR (Benjamini-Hochberg)", cat: stats, def_pt: "Controle da taxa de falsas descobertas quando muitos testes são feitos ao mesmo tempo; produz valores q.", def_en: "Control of the false-discovery rate when many tests are run together; yields q-values." }
  - { key: tost, pt: "TOST (equivalência)", en: "TOST (equivalence)", cat: stats, def_pt: "Dois testes unilaterais que verificam se um efeito é estatisticamente equivalente a zero dentro de uma margem.", def_en: "Two one-sided tests checking whether an effect is statistically equivalent to zero within a margin." }
  - { key: hindcast, pt: "Hindcast walk-forward", en: "Walk-forward hindcast", cat: stats, def_pt: "Previsão retrospectiva: treina só com o passado e prevê o ano seguinte, ano a ano, para medir capacidade preditiva real.", def_en: "Retrospective forecasting: train only on the past and predict the next year, year by year, to measure real predictive skill." }
  - { key: bss, pt: "BSS (Brier Skill Score)", en: "BSS (Brier Skill Score)", cat: stats, def_pt: "Ganho de acerto probabilístico em relação à taxa-base (climatologia). > 0 = melhor que o acaso; ≤ 0 = sem skill.", def_en: "Probabilistic accuracy gain over the base rate (climatology). > 0 = better than chance; ≤ 0 = no skill." }
  - { key: auc, pt: "AUC (ROC)", en: "AUC (ROC)", cat: stats, def_pt: "Área sob a curva ROC: 0,5 = discriminação nula; 1,0 = perfeita.", def_en: "Area under the ROC curve: 0.5 = no discrimination; 1.0 = perfect." }
  - { key: taxa_base, pt: "Taxa-base (climatologia)", en: "Base rate (climatology)", cat: stats, def_pt: "Frequência histórica simples do evento; a previsão mais ingênua, usada como referência.", def_en: "Simple historical frequency of the event; the naive forecast used as reference." }
  - { key: percentil_1000, pt: "Percentil 1000", en: "Percentile 1000", cat: stats, def_pt: "Escala de 0 a 1000 que posiciona um valor na distribuição de referência (500 = mediana).", def_en: "A 0–1000 scale placing a value within a reference distribution (500 = median)." }
  - { key: track_a_b, pt: "Track A / Track B", en: "Track A / Track B", cat: metodo, def_pt: "Track A: catálogo amplo para exploração e análogos. Track B: amostra congelada e pré-registrada para testes de hipótese.", def_en: "Track A: broad catalog for exploration and analogues. Track B: frozen, pre-registered sample for hypothesis tests." }
  - { key: precisao_data, pt: "Precisão da data", en: "Date precision", cat: dados, def_pt: "day / month / year / decade: só eventos com dia documentado entram em cálculos diários.", def_en: "day / month / year / decade: only day-dated events enter daily computations." }
  - { key: tier, pt: "Tier de fonte", en: "Source tier", cat: dados, def_pt: "A = documento primário; B = dataset acadêmico; C = enciclopédico auditado.", def_en: "A = primary document; B = academic dataset; C = audited encyclopedic." }
  - { key: polaridade, pt: "Polaridade", en: "Polarity", cat: dados, def_pt: "disruptive / constructive / structural: direção do evento (ruptura, construção, reforma).", def_en: "disruptive / constructive / structural: the direction of the event (rupture, construction, reform)." }
  - { key: dominios_vida, pt: "Domínios de vida", en: "Life domains", cat: astro, def_pt: "Oito áreas (identidade, lar, mente, relações, carreira, recursos, saúde/rotina, propósito) usadas para classificar trânsitos pessoais, com pesos explícitos em config.", def_en: "Eight areas (identity, home, mind, relationships, career, resources, health/routine, purpose) used to classify personal transits, with explicit weights in config." }
  - { key: episodio, pt: "Episódio de trânsito", en: "Transit episode", cat: astro, def_pt: "Conjunto de janelas da mesma série (ex.: as três passagens de uma quadratura de Saturno) agrupadas na linha da vida.", def_en: "Set of windows of the same series (e.g. the three passes of a Saturn square) grouped on the life timeline." }
