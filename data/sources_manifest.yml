  records_count: 299
  category: politics_geopolitics
  date_precision: day
  features:
  - conflict_episode_onset
  - incompatibility
  - intensity_level
- id: powell_thyne_coups
  name: Global Instances of Coups (Powell & Thyne Coup Dataset)
  institution: University of Kentucky & University of Central Florida (Powell & Thyne, 2011; atualizado 2026)
