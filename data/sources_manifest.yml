  category: politics_geopolitics
  date_precision: day
  features:
  - war_onset
  - combat_fatalities
  - interstate_belligerents
- id: ucdp_prio_armed_conflict
  name: UCDP/PRIO Armed Conflict Dataset v24.1
  institution: Uppsala Conflict Data Program & Peace Research Institute Oslo (Davies, Pettersson & Öberg, 2024)
