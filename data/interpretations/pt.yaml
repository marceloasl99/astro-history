# Biblioteca de interpretações (PT-BR) do módulo pessoal — astrologia moderna, tom reflexivo.
# Regras de redação: sem determinismo, sem previsão de eventos concretos, sem conselhos médicos,
# financeiros ou jurídicos. Textos originais do projeto AstroHistory (AGPL-3.0).

phrases:
  disclaimer: "Leitura simbólica (astrologia moderna). Os cálculos astronômicos são exatos; a interpretação não é empiricamente validada — veja a Metodologia."
  one_pass: "Janela de {start} a {end}, com passagem exata em {date}."
  many_passes: "Janela de {start} a {end}, com {n} passagens exatas: {dates}."
  no_exact: "Entre {start} e {end} o planeta se aproxima da orbe sem completar a passagem exata (aproximação)."
  house: "Esse ponto natal está na casa {house} ({theme}), que dá o cenário concreto do tema."

templates:
  focus: "{process} {point}: período de foco e concentração nesse tema, em que ele pede atenção direta."
  challenging: "{process} {point}: tensão produtiva — o tema é posto à prova e convida a ajustes, decisões e amadurecimento."
  flowing: "{process} {point}: facilitação — o tema encontra apoio, fluidez e oportunidades de integração."

