manual:
  transit.saturn.focus.sun: "Saturno conjunto ao Sol natal: ciclo de ~29 anos que pede definição. O que é essencial na sua identidade e no seu caminho ganha contorno; o supérfluo pesa. Costuma coincidir com responsabilidades novas, cansaço e, ao mesmo tempo, com uma clareza madura sobre o que vale construir."
  transit.saturn.challenging.sun: "Saturno em quadratura ou oposição ao Sol natal: prova de realidade. Planos encontram limites, autoridade e prazos; a vitalidade pode parecer menor. A proposta é consolidar com paciência, revisar compromissos e distinguir obrigação de vontade genuína."
  transit.saturn.flowing.sun: "Saturno em trígono ou sextil ao Sol natal: estrutura que sustenta. Bom período para formalizar, assumir cargos, concluir etapas e colher o que foi plantado com disciplina. A confiança vem da consistência, não da pressa."
  transit.saturn.focus.moon: "Saturno conjunto à Lua natal: sobriedade emocional. Necessidades afetivas são examinadas com realismo; pode haver sensação de solidão ou de peso familiar, mas também amadurecimento do modo de cuidar e de ser cuidado."
  transit.saturn.challenging.moon: "Saturno tensionando a Lua natal: contenção emocional e responsabilidades no lar ou na família. Convite a reconhecer necessidades sem exigir que os outros as satisfaçam, e a criar rotinas que deem segurança."
  transit.saturn.flowing.moon: "Saturno harmonizando a Lua natal: estabilidade emocional e sensatez. Período favorável para organizar a vida doméstica, firmar vínculos de confiança e cuidar de si com constância."
  transit.saturn.focus.asc: "Saturno conjunto ao Ascendente: início de um ciclo de ~29 anos de construção pessoal. A imagem que você projeta se torna mais séria e definida; o corpo pede disciplina. É um recomeço com responsabilidade."
  transit.saturn.challenging.asc: "Saturno em quadratura ou oposição ao Ascendente: tensão entre quem você é e as exigências do mundo ou dos relacionamentos. Limites claros e compromissos revistos resolvem mais do que resistência."
  transit.saturn.focus.mc: "Saturno conjunto ao Meio do Céu: culminação profissional. O papel público é testado e consolidado; reconhecimentos e responsabilidades chegam juntos. Resultados refletem a consistência dos anos anteriores."
  transit.saturn.challenging.mc: "Saturno tensionando o Meio do Céu: pressão sobre carreira, reputação ou equilíbrio entre vida pública e privada. Período para reavaliar metas, aceitar limites institucionais e redefinir ambição."
  transit.uranus.focus.sun: "Urano conjunto ao Sol natal: despertar de identidade. O desejo de autenticidade e liberdade se impõe; rotinas antigas parecem apertadas. Mudanças repentinas abrem espaço para uma versão mais verdadeira de si."
  transit.uranus.challenging.sun: "Urano em quadratura ou oposição ao Sol natal: inquietação e rupturas. O que estava rígido pode quebrar — relações, trabalho, autoimagem. A energia é disruptiva, mas sua função é libertar; a chave é flexibilidade sem impulsividade."
  transit.uranus.flowing.sun: "Urano em trígono ou sextil ao Sol natal: renovação criativa. Ideias originais, novas tecnologias, pessoas e ambientes diferentes revitalizam a direção de vida com entusiasmo e pouca resistência."
  transit.uranus.focus.moon: "Urano conjunto à Lua natal: emoções eletrizadas. Mudanças de casa, de vínculos ou de hábitos emocionais; a necessidade de espaço e independência afetiva fica intensa."
  transit.uranus.challenging.moon: "Urano tensionando a Lua natal: instabilidade emocional e doméstica. Humores oscilam, surpresas na família ou no lar pedem adaptação. O aprendizado é não confundir liberdade com fuga."
  transit.uranus.flowing.moon: "Urano harmonizando a Lua natal: frescor emocional. Novas formas de morar, cuidar e se relacionar surgem com naturalidade; a intuição fica aguçada."
  transit.uranus.focus.asc: "Urano conjunto ao Ascendente: reinvenção da própria imagem e do modo de iniciar as coisas. Mudanças de aparência, de círculo social e de atitude; impulso forte de ser diferente."
  transit.uranus.challenging.asc: "Urano em quadratura ou oposição ao Ascendente: choques entre autonomia e relacionamento. Parcerias passam por reviravoltas; a pessoa pode sentir-se puxada entre independência e compromisso."
  transit.uranus.focus.mc: "Urano conjunto ao Meio do Céu: virada vocacional. Carreiras mudam de rumo, muitas vezes de forma inesperada, em direção a algo mais inovador ou independente."
  transit.uranus.challenging.mc: "Urano tensionando o Meio do Céu: instabilidade profissional ou conflito entre vida pública e privada. Pede abertura para novos formatos de trabalho sem decisões precipitadas."
  transit.neptune.focus.sun: "Netuno conjunto ao Sol natal: dissolução de contornos da identidade. Sensibilidade, espiritualidade e imaginação crescem; clareza e energia podem diminuir. Período para escutar o que inspira, com atenção a ilusões e excessos."
  transit.neptune.challenging.sun: "Netuno em quadratura ou oposição ao Sol natal: desorientação e desgaste sutil. Metas parecem nebulosas, confiança oscila, a vontade se dispersa. Ancorar-se em rotinas simples e discernir fatos de fantasias ajuda a atravessar."
  transit.neptune.flowing.sun: "Netuno em trígono ou sextil ao Sol natal: inspiração e compaixão. Criatividade, vida interior e empatia fluem; bom período para arte, espiritualidade e serviço."
  transit.neptune.focus.moon: "Netuno conjunto à Lua natal: emoções permeáveis. Grande sensibilidade a ambientes e pessoas; nostalgia, sonhos vívidos e necessidade de refúgio. Importante proteger limites emocionais."
  transit.neptune.challenging.moon: "Netuno tensionando a Lua natal: confusão emocional, idealizações na família ou nos vínculos, sensação de perda ou saudade difusa. Pede realismo gentil e descanso."
  transit.neptune.flowing.moon: "Netuno harmonizando a Lua natal: ternura e intuição. Período em que acolher e ser acolhido vem com facilidade; a imaginação nutre."
  transit.pluto.focus.sun: "Plutão conjunto ao Sol natal: transformação radical da identidade (ocorre uma vez na vida, se ocorrer). Algo essencial morre para que outra força nasça; questões de poder, verdade e sobrevivência psíquica vêm à frente. Intenso, lento e profundamente regenerador."
  transit.pluto.challenging.sun: "Plutão em quadratura ou oposição ao Sol natal: crise de poder e propósito. Pressões externas ou internas expõem o que precisa ser transformado; controle e rendição se alternam. A saída costuma ser por dentro: honestidade radical e desapego do que já não serve."
  transit.pluto.flowing.sun: "Plutão em trígono ou sextil ao Sol natal: empoderamento gradual. A vontade ganha profundidade e foco; é possível reconstruir áreas da vida com determinação e sem grandes rupturas."
  transit.pluto.focus.moon: "Plutão conjunto à Lua natal: transformação das raízes emocionais. Padrões de família e segurança são desenterrados e refeitos; emoções intensas pedem elaboração."
  transit.pluto.challenging.moon: "Plutão tensionando a Lua natal: emoções de fundo — ciúme, medo, apego, ressentimento — vêm à superfície para serem transformadas. Relações íntimas e familiares passam por catarses."
  transit.pluto.flowing.moon: "Plutão harmonizando a Lua natal: profundidade emocional construtiva. Boa fase para terapia, cura de vínculos e fortalecimento da segurança interior."
  transit.pluto.focus.asc: "Plutão conjunto ao Ascendente: renascimento da persona. Mudança profunda na forma de se apresentar, no corpo e no modo de iniciar; poder pessoal se reorganiza."
  transit.pluto.challenging.asc: "Plutão em quadratura ou oposição ao Ascendente: dinâmicas de poder nos relacionamentos e na identidade. Convite a reconhecer onde se controla ou se é controlado."
  transit.pluto.focus.mc: "Plutão conjunto ao Meio do Céu: metamorfose vocacional. A missão pública se transforma; poder, influência e exposição aumentam, com responsabilidade proporcional."
  transit.pluto.challenging.mc: "Plutão tensionando o Meio do Céu: crises de carreira ou de reputação como alavanca de transformação. Reavaliar ambição, ética e a relação com autoridades."
  transit.jupiter.focus.sun: "Júpiter conjunto ao Sol natal: renovação de confiança e otimismo (a cada ~12 anos). Portas se abrem; é hora de plantar, estudar, viajar e ampliar horizontes com medida."
  transit.jupiter.challenging.sun: "Júpiter em quadratura ou oposição ao Sol natal: excesso de confiança ou expectativas desmedidas. O entusiasmo é real, mas pede proporção e prudência."
  transit.jupiter.flowing.sun: "Júpiter em trígono ou sextil ao Sol natal: fluidez e sorte percebida. Reconhecimento, aprendizado e generosidade circulam com facilidade."
  transit.chiron.focus.sun: "Quíron conjunto ao Sol natal: a ferida de identidade — sentir-se inadequado ou não visto — vem à luz para ser integrada. Vulnerabilidade pode se tornar fonte de sabedoria e de capacidade de ajudar."
  transit.chiron.challenging.sun: "Quíron tensionando o Sol natal: inseguranças antigas reaparecem. A tarefa não é eliminá-las, mas conviver com elas com compaixão e humor."
  transit.mean_node.focus.sun: "Nodo Norte conjunto ao Sol natal: alinhamento entre identidade e direção de vida. Encontros e escolhas desse período tendem a ter sabor de destino."

cycles:
  saturn_conjunction: "Retorno de Saturno: fim de um ciclo de ~29,5 anos e início de outro. Balanço de maturidade — o que foi construído com verdade permanece; o que foi mantido por medo ou hábito pede encerramento. Marca passagens para a vida adulta (≈29), para a maturidade (≈59) e para a sabedoria (≈88)."
  saturn_square: "Quadratura de Saturno ao próprio Saturno (≈7, 22, 37, 51, 66, 81 anos): ponto de verificação do ciclo. Ajustes de rota, provas de compromisso e sensação de 'crescer à força'."
  saturn_opposition: "Oposição de Saturno (≈14–15, 44, 74 anos): meio do ciclo. Confronto entre o que se construiu e o que o mundo devolve; momento de reconhecer limites e redefinir metas."
  jupiter_conjunction: "Retorno de Júpiter (a cada ~12 anos): renovação de fé, oportunidades e visão de futuro. Bom para iniciar estudos, viagens e projetos de longo alcance."
  jupiter_opposition: "Oposição de Júpiter: expansão testada pelo excesso; pede equilíbrio entre otimismo e realismo."
  uranus_square: "Quadratura de Urano ao próprio Urano (≈21 e ≈63 anos): impulso de independência e ruptura com padrões — o 'despertar' do início da vida adulta e a liberdade da maturidade."
  uranus_opposition: "Oposição de Urano (≈40–42 anos): a chamada crise da meia-vida. O que foi adiado reivindica espaço; autenticidade e liberdade tornam-se urgentes. Mudanças bem conduzidas aqui rejuvenescem o resto da vida."
  uranus_conjunction: "Retorno de Urano (≈84 anos): ciclo completo de individuação; liberdade interior e visão de conjunto."
  neptune_square: "Quadratura de Netuno (≈41 anos): questionamento de ideais e do sentido; desilusões abrem espaço para uma fé mais madura."
  neptune_opposition: "Oposição de Netuno (≈82 anos): dissolução de fronteiras do ego; espiritualidade e contemplação."
  pluto_square: "Quadratura de Plutão ao próprio Plutão (idade varia por geração, ~36–60 anos): confronto com poder, controle e mortalidade; transformação do propósito."
  pluto_opposition: "Oposição de Plutão: raríssima em uma vida; profunda reavaliação do poder pessoal."
  chiron_conjunction: "Retorno de Quíron (≈50 anos): integração da ferida de vida. O que doeu se torna conhecimento e capacidade de orientar outros."
  chiron_square: "Quadratura de Quíron: reabertura de feridas para novo nível de cura."
  chiron_opposition: "Oposição de Quíron (≈ 13 e ≈ 63 anos): a ferida vista 'do outro lado', frequentemente através de relacionamentos."
  mean_node_conjunction: "Retorno Nodal (≈18,6, 37, 56, 74, 93 anos): realinhamento com a direção de vida; encontros e decisões com peso de destino."
  mean_node_opposition: "Retorno Nodal Inverso (≈9, 28, 46, 65, 84 anos): tensão entre passado confortável e futuro necessário; escolhas de rumo."
  sun_conjunction: "Retorno Solar: o Sol volta à posição natal — o 'ano novo pessoal'. Renovação de vitalidade e intenções."
  mars_conjunction: "Retorno de Marte (a cada ~2 anos): recarga de energia e desejo; bom para iniciar ações."

progressed_moon_signs:
  0: "Lua progredida em Áries (~2,5 anos): necessidades emocionais pedem iniciativa, independência e coragem. Fase para começar e se afirmar."
  1: "Lua progredida em Touro: busca de estabilidade, conforto e segurança material; ritmo mais lento e sensorial."
  2: "Lua progredida em Gêmeos: curiosidade, trocas, estudos e movimento; a emoção se expressa pela palavra."
  3: "Lua progredida em Câncer: foco em lar, família e pertencimento; sensibilidade e memória afetiva em alta."
  4: "Lua progredida em Leão: necessidade de expressão, reconhecimento e alegria; criatividade e orgulho."
  5: "Lua progredida em Virgem: organização, cuidado com saúde e rotina, senso de utilidade; autocrítica a moderar."
  6: "Lua progredida em Libra: relacionamentos, equilíbrio e estética ganham centralidade; busca de harmonia."
  7: "Lua progredida em Escorpião: intensidade emocional, intimidade e transformação; o que estava oculto emerge."
  8: "Lua progredida em Sagitário: expansão, viagens, fé e otimismo; necessidade de sentido e liberdade."
  9: "Lua progredida em Capricórnio: responsabilidade, metas e sobriedade emocional; construção paciente."
  10: "Lua progredida em Aquário: necessidade de espaço, ideias e pertencimento a grupos; distanciamento afetivo saudável."
  11: "Lua progredida em Peixes: sensibilidade, imaginação e compaixão; fase de encerramento de ciclo e recolhimento."

progressed_moon_houses:
  1: "Lua progredida na casa 1: foco emocional em si mesmo, no corpo e em novos começos."
  2: "Lua progredida na casa 2: segurança material e valores pessoais em primeiro plano."
  3: "Lua progredida na casa 3: comunicação, estudos, irmãos e vizinhança ocupam a atenção."
  4: "Lua progredida na casa 4: lar, família e raízes; fase de interiorização."
  5: "Lua progredida na casa 5: criatividade, prazer, romance e filhos."
  6: "Lua progredida na casa 6: rotina, trabalho cotidiano e cuidado com a saúde."
  7: "Lua progredida na casa 7: parcerias e relacionamentos no centro da vida emocional."
  8: "Lua progredida na casa 8: intimidade, perdas e renascimentos; recursos compartilhados."
  9: "Lua progredida na casa 9: viagens, estudos superiores e busca de sentido."
  10: "Lua progredida na casa 10: carreira, reconhecimento e papel público."
  11: "Lua progredida na casa 11: amizades, grupos e projetos coletivos."
  12: "Lua progredida na casa 12: retiro, inconsciente e encerramentos; necessidade de silêncio."

lunation_phases:
  0: "Fase Nova progredida: início de um ciclo de ~30 anos; sementes plantadas quase às cegas."
  1: "Fase Crescente: esforço para firmar o novo contra a inércia do passado."
  2: "Quarto Crescente: crise de ação — decisões que estruturam o ciclo."
  3: "Fase Gibosa: aperfeiçoamento, análise e preparação para o auge."
  4: "Fase Cheia: culminação e clareza; o sentido do ciclo se revela, muitas vezes via relacionamentos."
  5: "Fase Disseminadora: compartilhar o que foi aprendido; ensino e influência."
  6: "Quarto Minguante: crise de consciência — reavaliar valores e desapegar."
  7: "Fase Balsâmica: encerramento, síntese e entrega; preparação para o novo ciclo."

glossary:
  orbe: "Distância angular máxima (em graus) para considerar um aspecto ativo."
  aspecto: "Ângulo significativo entre dois pontos do zodíaco (0°, 60°, 90°, 120°, 180°)."
  trânsito: "Posição atual (ou futura/passada) de um planeta em relação ao mapa natal."
  progressão_secundária: "Técnica simbólica em que cada dia após o nascimento equivale a um ano de vida."
  retorno: "Momento em que um planeta volta à posição que ocupava no nascimento."
  aplicativo: "Aspecto que ainda se aproxima do ângulo exato."
  separativo: "Aspecto que já passou do ângulo exato e se afasta."
  retrógrado: "Movimento aparente para trás no zodíaco, visto da Terra."
