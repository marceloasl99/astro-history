# Interpretation library (EN) for the personal module — modern astrology, reflective tone.
# Writing rules: no determinism, no prediction of concrete events, no medical, financial or legal advice.
# Original texts of the AstroHistory project (AGPL-3.0).

phrases:
  disclaimer: "Symbolic reading (modern astrology). Astronomical computations are exact; the interpretation is not empirically validated — see Methodology."
  one_pass: "Window from {start} to {end}, exact on {date}."
  many_passes: "Window from {start} to {end}, with {n} exact passes: {dates}."
  no_exact: "Between {start} and {end} the planet approaches within orb without completing an exact pass (near miss)."
  house: "This natal point sits in house {house} ({theme}), which gives the theme its concrete setting."

templates:
  focus: "{process} {point}: a period of focus and concentration on this theme, which asks for direct attention."
  challenging: "{process} {point}: productive tension — the theme is tested and invites adjustments, decisions and maturation."
  flowing: "{process} {point}: ease — the theme finds support, flow and opportunities for integration."

