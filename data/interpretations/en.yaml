manual:
  transit.saturn.focus.sun: "Saturn conjunct the natal Sun: a ~29-year cycle asking for definition. What is essential in your identity and path gains outline; the superfluous weighs. It often coincides with new responsibilities, fatigue and, at the same time, a mature clarity about what is worth building."
  transit.saturn.challenging.sun: "Saturn square or opposite the natal Sun: a reality check. Plans meet limits, authority and deadlines; vitality may feel lower. The invitation is to consolidate patiently, review commitments and distinguish obligation from genuine will."
  transit.saturn.flowing.sun: "Saturn trine or sextile the natal Sun: structure that supports. A good period to formalise, take on roles, finish stages and reap what was planted with discipline. Confidence comes from consistency, not haste."
  transit.saturn.focus.moon: "Saturn conjunct the natal Moon: emotional sobriety. Affective needs are examined realistically; there may be a sense of loneliness or family weight, but also a maturing of how you care and are cared for."
  transit.saturn.challenging.moon: "Saturn straining the natal Moon: emotional restraint and responsibilities at home or in the family. An invitation to recognise needs without demanding that others meet them, and to create routines that give security."
  transit.saturn.flowing.moon: "Saturn harmonising the natal Moon: emotional stability and good sense. Favourable for organising domestic life, firming bonds of trust and caring for yourself steadily."
  transit.saturn.focus.asc: "Saturn conjunct the Ascendant: the start of a ~29-year cycle of personal construction. The image you project becomes more serious and defined; the body asks for discipline. A new beginning with responsibility."
  transit.saturn.challenging.asc: "Saturn square or opposite the Ascendant: tension between who you are and the demands of the world or of relationships. Clear limits and revised commitments resolve more than resistance."
  transit.saturn.focus.mc: "Saturn conjunct the Midheaven: professional culmination. The public role is tested and consolidated; recognition and responsibility arrive together. Results reflect the consistency of previous years."
  transit.saturn.challenging.mc: "Saturn straining the Midheaven: pressure on career, reputation or the balance between public and private life. A time to reassess goals, accept institutional limits and redefine ambition."
  transit.uranus.focus.sun: "Uranus conjunct the natal Sun: an awakening of identity. The desire for authenticity and freedom asserts itself; old routines feel tight. Sudden changes make room for a truer version of yourself."
  transit.uranus.challenging.sun: "Uranus square or opposite the natal Sun: restlessness and ruptures. What was rigid may break — relationships, work, self-image. The energy is disruptive, but its function is to free; the key is flexibility without impulsiveness."
  transit.uranus.flowing.sun: "Uranus trine or sextile the natal Sun: creative renewal. Original ideas, new technologies, different people and settings revitalise your direction with enthusiasm and little resistance."
  transit.uranus.focus.moon: "Uranus conjunct the natal Moon: electrified emotions. Changes of home, bonds or emotional habits; the need for space and affective independence becomes intense."
  transit.uranus.challenging.moon: "Uranus straining the natal Moon: emotional and domestic instability. Moods swing, surprises in the family or home demand adaptation. The lesson is not to confuse freedom with flight."
  transit.uranus.flowing.moon: "Uranus harmonising the natal Moon: emotional freshness. New ways of living, caring and relating arise naturally; intuition sharpens."
  transit.uranus.focus.asc: "Uranus conjunct the Ascendant: reinvention of your image and of how you begin things. Changes in appearance, social circle and attitude; a strong impulse to be different."
  transit.uranus.challenging.asc: "Uranus square or opposite the Ascendant: clashes between autonomy and relationship. Partnerships go through upheavals; you may feel pulled between independence and commitment."
  transit.uranus.focus.mc: "Uranus conjunct the Midheaven: a vocational turn. Careers change course, often unexpectedly, toward something more innovative or independent."
  transit.uranus.challenging.mc: "Uranus straining the Midheaven: professional instability or conflict between public and private life. It asks for openness to new work formats without rash decisions."
  transit.neptune.focus.sun: "Neptune conjunct the natal Sun: dissolution of the outlines of identity. Sensitivity, spirituality and imagination grow; clarity and energy may diminish. A period to listen to what inspires, mindful of illusions and excess."
  transit.neptune.challenging.sun: "Neptune square or opposite the natal Sun: disorientation and subtle wear. Goals look hazy, confidence wavers, will disperses. Anchoring in simple routines and separating facts from fantasies helps you through."
  transit.neptune.flowing.sun: "Neptune trine or sextile the natal Sun: inspiration and compassion. Creativity, inner life and empathy flow; good for art, spirituality and service."
  transit.neptune.focus.moon: "Neptune conjunct the natal Moon: permeable emotions. Great sensitivity to places and people; nostalgia, vivid dreams and a need for refuge. Protecting emotional boundaries matters."
  transit.neptune.challenging.moon: "Neptune straining the natal Moon: emotional confusion, idealisations in family or bonds, a diffuse sense of loss or longing. Asks for gentle realism and rest."
  transit.neptune.flowing.moon: "Neptune harmonising the natal Moon: tenderness and intuition. A period when holding and being held come easily; imagination nourishes."
  transit.pluto.focus.sun: "Pluto conjunct the natal Sun: radical transformation of identity (once in a lifetime, if at all). Something essential dies so another force can be born; questions of power, truth and psychic survival come forward. Intense, slow and deeply regenerative."
  transit.pluto.challenging.sun: "Pluto square or opposite the natal Sun: a crisis of power and purpose. External or internal pressures expose what needs transforming; control and surrender alternate. The way out is usually inward: radical honesty and letting go of what no longer serves."
  transit.pluto.flowing.sun: "Pluto trine or sextile the natal Sun: gradual empowerment. Will gains depth and focus; areas of life can be rebuilt with determination and without major ruptures."
  transit.pluto.focus.moon: "Pluto conjunct the natal Moon: transformation of emotional roots. Patterns of family and security are unearthed and remade; intense emotions ask to be worked through."
  transit.pluto.challenging.moon: "Pluto straining the natal Moon: background emotions — jealousy, fear, attachment, resentment — surface to be transformed. Intimate and family relationships go through catharsis."
  transit.pluto.flowing.moon: "Pluto harmonising the natal Moon: constructive emotional depth. A good phase for therapy, healing of bonds and strengthening inner security."
  transit.pluto.focus.asc: "Pluto conjunct the Ascendant: rebirth of the persona. Deep change in how you present yourself, in the body and in how you begin; personal power reorganises."
  transit.pluto.challenging.asc: "Pluto square or opposite the Ascendant: power dynamics in relationships and identity. An invitation to recognise where you control or are controlled."
  transit.pluto.focus.mc: "Pluto conjunct the Midheaven: vocational metamorphosis. The public mission transforms; power, influence and exposure grow, with proportional responsibility."
  transit.pluto.challenging.mc: "Pluto straining the Midheaven: career or reputation crises as a lever for transformation. Reassess ambition, ethics and your relationship with authority."
  transit.jupiter.focus.sun: "Jupiter conjunct the natal Sun: renewed confidence and optimism (every ~12 years). Doors open; time to plant, study, travel and widen horizons with measure."
  transit.jupiter.challenging.sun: "Jupiter square or opposite the natal Sun: overconfidence or outsized expectations. The enthusiasm is real, but asks for proportion and prudence."
  transit.jupiter.flowing.sun: "Jupiter trine or sextile the natal Sun: flow and perceived luck. Recognition, learning and generosity circulate easily."
  transit.chiron.focus.sun: "Chiron conjunct the natal Sun: the identity wound — feeling inadequate or unseen — comes to light to be integrated. Vulnerability can become a source of wisdom and of the capacity to help."
  transit.chiron.challenging.sun: "Chiron straining the natal Sun: old insecurities reappear. The task is not to eliminate them but to live with them with compassion and humour."
  transit.mean_node.focus.sun: "North Node conjunct the natal Sun: alignment between identity and life direction. Encounters and choices of this period tend to feel fated."

cycles:
  saturn_conjunction: "Saturn Return: the end of a ~29.5-year cycle and the start of another. A maturity audit — what was built truthfully remains; what was kept out of fear or habit asks for closure. It marks passages into adulthood (≈29), maturity (≈59) and elderhood (≈88)."
  saturn_square: "Saturn square its own place (≈7, 22, 37, 51, 66, 81): a checkpoint of the cycle. Course corrections, tests of commitment and a sense of 'growing up by force'."
  saturn_opposition: "Saturn opposition (≈14–15, 44, 74): mid-cycle. Confrontation between what you built and what the world gives back; a time to acknowledge limits and redefine goals."
  jupiter_conjunction: "Jupiter Return (every ~12 years): renewal of faith, opportunity and vision. Good for starting studies, travel and long-range projects."
  jupiter_opposition: "Jupiter opposition: expansion tested by excess; asks for balance between optimism and realism."
  uranus_square: "Uranus square its own place (≈21 and ≈63): an impulse toward independence and rupture with patterns — the 'awakening' of early adulthood and the freedom of maturity."
  uranus_opposition: "Uranus opposition (≈40–42): the so-called midlife crisis. What was postponed claims space; authenticity and freedom become urgent. Changes well handled here rejuvenate the rest of life."
  uranus_conjunction: "Uranus Return (≈84): a complete cycle of individuation; inner freedom and overview."
  neptune_square: "Neptune square (≈41): questioning of ideals and meaning; disillusionment makes room for a more mature faith."
  neptune_opposition: "Neptune opposition (≈82): dissolution of ego boundaries; spirituality and contemplation."
  pluto_square: "Pluto square its own place (age varies by generation, ~36–60): confrontation with power, control and mortality; transformation of purpose."
  pluto_opposition: "Pluto opposition: extremely rare in a lifetime; deep reassessment of personal power."
  chiron_conjunction: "Chiron Return (≈50): integration of the life wound. What hurt becomes knowledge and the capacity to guide others."
  chiron_square: "Chiron square: wounds reopen for a new level of healing."
  chiron_opposition: "Chiron opposition (≈13 and ≈63): the wound seen 'from the other side', often through relationships."
  mean_node_conjunction: "Nodal Return (≈18.6, 37, 56, 74, 93): realignment with life direction; encounters and decisions with the weight of destiny."
  mean_node_opposition: "Inverse Nodal Return (≈9, 28, 46, 65, 84): tension between a comfortable past and a necessary future; choices of course."
  sun_conjunction: "Solar Return: the Sun returns to its natal position — your 'personal new year'. Renewal of vitality and intentions."
  mars_conjunction: "Mars Return (every ~2 years): a recharge of energy and desire; good for starting actions."

progressed_moon_signs:
  0: "Progressed Moon in Aries (~2.5 years): emotional needs call for initiative, independence and courage. A phase to begin and assert yourself."
  1: "Progressed Moon in Taurus: a search for stability, comfort and material security; a slower, more sensory pace."
  2: "Progressed Moon in Gemini: curiosity, exchange, study and movement; emotion expressed through words."
  3: "Progressed Moon in Cancer: focus on home, family and belonging; heightened sensitivity and affective memory."
  4: "Progressed Moon in Leo: a need for expression, recognition and joy; creativity and pride."
  5: "Progressed Moon in Virgo: organisation, care for health and routine, a sense of usefulness; self-criticism to moderate."
  6: "Progressed Moon in Libra: relationships, balance and aesthetics take centre stage; a search for harmony."
  7: "Progressed Moon in Scorpio: emotional intensity, intimacy and transformation; what was hidden emerges."
  8: "Progressed Moon in Sagittarius: expansion, travel, faith and optimism; a need for meaning and freedom."
  9: "Progressed Moon in Capricorn: responsibility, goals and emotional sobriety; patient building."
  10: "Progressed Moon in Aquarius: a need for space, ideas and belonging to groups; healthy affective distance."
  11: "Progressed Moon in Pisces: sensitivity, imagination and compassion; a closing phase of the cycle and withdrawal."

progressed_moon_houses:
  1: "Progressed Moon in the 1st house: emotional focus on yourself, the body and new beginnings."
  2: "Progressed Moon in the 2nd house: material security and personal values in the foreground."
  3: "Progressed Moon in the 3rd house: communication, study, siblings and neighbourhood hold attention."
  4: "Progressed Moon in the 4th house: home, family and roots; a phase of turning inward."
  5: "Progressed Moon in the 5th house: creativity, pleasure, romance and children."
  6: "Progressed Moon in the 6th house: routine, daily work and care for health."
  7: "Progressed Moon in the 7th house: partnerships and relationships at the centre of emotional life."
  8: "Progressed Moon in the 8th house: intimacy, losses and rebirths; shared resources."
  9: "Progressed Moon in the 9th house: travel, higher learning and the search for meaning."
  10: "Progressed Moon in the 10th house: career, recognition and public role."
  11: "Progressed Moon in the 11th house: friendships, groups and collective projects."
  12: "Progressed Moon in the 12th house: retreat, the unconscious and endings; a need for silence."

lunation_phases:
  0: "Progressed New phase: the start of a ~30-year cycle; seeds planted almost blindly."
  1: "Crescent phase: effort to establish the new against the inertia of the past."
  2: "First Quarter: a crisis of action — decisions that structure the cycle."
  3: "Gibbous phase: refinement, analysis and preparation for the peak."
  4: "Full phase: culmination and clarity; the meaning of the cycle reveals itself, often through relationships."
  5: "Disseminating phase: sharing what was learned; teaching and influence."
  6: "Last Quarter: a crisis of consciousness — reassessing values and letting go."
  7: "Balsamic phase: closure, synthesis and surrender; preparation for the new cycle."

glossary:
  orb: "Maximum angular distance (in degrees) for an aspect to be considered active."
  aspect: "A meaningful angle between two zodiac points (0°, 60°, 90°, 120°, 180°)."
  transit: "The current (or future/past) position of a planet relative to the natal chart."
  secondary_progression: "A symbolic technique in which each day after birth equals one year of life."
  return: "The moment a planet comes back to the position it held at birth."
  applying: "An aspect still approaching the exact angle."
  separating: "An aspect past the exact angle and moving away."
  retrograde: "Apparent backward motion through the zodiac, as seen from Earth."
